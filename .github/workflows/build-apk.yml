name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat source.b64.part1 source.b64.part2 source.b64.part3 source.b64.part4 | tr -d '\n\r' | base64 -d > source-fixed.zip
          unzip -o -q source-fixed.zip || true
          cat > CarbCycleCompanion_Android_Source/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'CarbCycleCompanion'
          include ':app'
          EOF
          test -f CarbCycleCompanion_Android_Source/app/build.gradle
          test -f CarbCycleCompanion_Android_Source/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: CarbCycleCompanion_Android_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp CarbCycleCompanion_Android_Source/app/build/outputs/apk/debug/app-debug.apk Carb-Cycle-Companion-S25-Ultra.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Carb-Cycle-Companion-S25-Ultra-APK
          path: Carb-Cycle-Companion-S25-Ultra.apk
          if-no-files-found: error
