name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat minnav4_part1.txt minnav4_part2.txt minnav4_part3.txt minnav4_part4.txt | tr -d '\n\r' | base64 -d > source-fixed.zip
          unzip -o -q source-fixed.zip || true

          # Apply the ShredCycle v2 upgrade over the last S25 Ultra-compatible build.
          cat shredcycle_v2_overlay.part01 \
              shredcycle_v2_overlay.part02 \
              shredcycle_v2_overlay.part03a \
              shredcycle_v2_overlay.part03b \
              shredcycle_v2_overlay.part03c \
              shredcycle_v2_overlay.part04a \
              shredcycle_v2_overlay.part04b \
            | tr -d '\n\r' | base64 -d > shredcycle-v2-overlay.zip
          unzip -t shredcycle-v2-overlay.zip
          unzip -o -q shredcycle-v2-overlay.zip -d CarbCycleCompanion_Android_Source

          # Use the approved ShredCycle mark everywhere the Android/PWA shell expects an icon.
          cp CarbCycleCompanion_Android_Source/app/src/main/assets/assets/shredcycle-icon.png \
             CarbCycleCompanion_Android_Source/app/src/main/res/drawable/app_icon.png
          cp CarbCycleCompanion_Android_Source/app/src/main/assets/assets/shredcycle-icon.png \
             CarbCycleCompanion_Android_Source/app/src/main/assets/assets/icon-192.png
          cp CarbCycleCompanion_Android_Source/app/src/main/assets/assets/shredcycle-icon.png \
             CarbCycleCompanion_Android_Source/app/src/main/assets/assets/icon-512.png

          cat > CarbCycleCompanion_Android_Source/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'ShredCycle'
          include ':app'
          EOF

          test -f CarbCycleCompanion_Android_Source/app/build.gradle
          test -f CarbCycleCompanion_Android_Source/app/src/main/AndroidManifest.xml
          test -f CarbCycleCompanion_Android_Source/app/src/main/assets/shredcycle-v2.js
          test -f CarbCycleCompanion_Android_Source/app/src/main/assets/shredcycle-v2.css

          # Preserve the Android WebView modal visibility fix.
          cat >> CarbCycleCompanion_Android_Source/app/src/main/assets/styles.css <<'EOF'

          /* Native Android modal visibility fix */
          .modal[hidden]{display:none!important}
          .modal:not([hidden]){display:flex}
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: carb-cycle-companion-debug-signing-v1

      - name: Build ShredCycle v2 APK
        working-directory: CarbCycleCompanion_Android_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp CarbCycleCompanion_Android_Source/app/build/outputs/apk/debug/app-debug.apk ShredCycle-S25-Ultra-v2.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ShredCycle-S25-Ultra-v2-APK
          path: ShredCycle-S25-Ultra-v2.apk
          if-no-files-found: error
